<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="src/assets/images/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#028090" />

  <!-- Static primary meta. This app renders entirely client-side, so anything
       not in this document is invisible to crawlers that don't execute JS. -->
  <title>Aparte — Luxury Short-Stay Apartments &amp; Homes in Nigeria</title>
  <meta name="description" content="Aparte connects discerning travellers with handpicked luxury short-stay apartments, homes and hotels across Nigeria. Browse verified listings, see real-time availability and book your next stay instantly." />
  <link rel="canonical" href="https://aparte.ng/" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Aparte" />
  <meta property="og:title" content="Aparte — Luxury Short-Stay Apartments & Homes in Nigeria" />
  <meta property="og:description" content="Handpicked luxury short-stay apartments, homes and hotels across Nigeria. Browse verified listings and book instantly." />
  <meta property="og:url" content="https://aparte.ng/" />
  <meta property="og:locale" content="en_NG" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Aparte — Luxury Short-Stay Apartments & Homes in Nigeria" />
  <meta name="twitter:description" content="Handpicked luxury short-stay apartments, homes and hotels across Nigeria. Browse verified listings and book instantly." />

  <!-- Registered-entity structured data, served in RAW HTML so it is readable
       by crawlers that don't run JS — GPTBot, ClaudeBot, PerplexityBot, Bingbot
       and social unfurlers. Keep in sync with the footer disclosure in
       src/sections/Footer.tsx and the "## Company" block in public/llms.txt. -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "@id": "https://aparte.ng/#organization",
      "name": "Aparte Luxurious Homes",
      "legalName": "Aparte Digital Limited",
      "alternateName": ["Aparte", "Aparte Digital Limited"],
      "identifier": {
        "@type": "PropertyValue",
        "propertyID": "RC Number",
        "name": "Corporate Affairs Commission (Nigeria) registration number",
        "value": "9311297"
      },
      "url": "https://aparte.ng",
      "logo": "https://cdn.builder.io/api/v1/image/assets/TEMP/3b38bbc7c5ff8c386fd93465ae15df57abad2ed77415c2a134724b60741e6ac0?placeholderIfAbsent=true&apiKey=8e9d8cabec6941f3ad44d75c45253ccb",
      "email": "support@aparte.ng",
      "description": "Aparte connects discerning travellers with handpicked luxury short-stay apartments, homes and hotels across Nigeria. Browse verified listings, see real-time availability and book your next stay instantly.",
      "address": { "@type": "PostalAddress", "addressCountry": "NG" },
      "areaServed": { "@type": "Country", "name": "Nigeria" }
    }
  </script>

  <script src="https://sdk.monnify.com/plugin/monnify.js"></script>
  <script src="https://js.paystack.co/v1/inline.js"></script>
  <!-- <script src="https://checkout.flutterwave.com/v3.js"></script> -->
</head>

<body>
  <div id="root"></div>
  <!-- Text fallback for crawlers and readers that don't execute JS. The React
       footer carries the same line once the app hydrates. -->
  <noscript>
    <h1>Aparte — Luxury Short-Stay Apartments &amp; Homes in Nigeria</h1>
    <p>
      Aparte connects travellers with handpicked, verified luxury short-stay apartments,
      homes and hotels across Nigeria. Aparte and Aparte Luxurious Homes are trading names
      of <strong>Aparte Digital Limited</strong>, a company registered in Nigeria with the
      Corporate Affairs Commission under <strong>RC 9311297</strong>.
      Contact: <a href="mailto:support@aparte.ng">support@aparte.ng</a>.
    </p>
  </noscript>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-element-bundle.min.js"></script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
