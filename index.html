<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#028090" />

  <!-- Primary meta. These are the static defaults non-JS crawlers see first.
       data-rh="true" lets react-helmet-async (<Seo>) cleanly REPLACE them after
       hydration instead of appending duplicates. -->
  <title>Aparte — Luxury Short-Stay Apartments &amp; Homes in Nigeria</title>
  <meta name="description" data-rh="true" content="Aparte connects discerning travellers with handpicked luxury short-stay apartments, homes and hotels across Nigeria. Browse verified listings, see real-time availability and book your next stay instantly." />
  <link rel="canonical" data-rh="true" href="https://aparte.ng/" />

  <!-- Open Graph -->
  <meta property="og:type" data-rh="true" content="website" />
  <meta property="og:site_name" data-rh="true" content="Aparte" />
  <meta property="og:title" data-rh="true" content="Aparte — Luxury Short-Stay Apartments & Homes in Nigeria" />
  <meta property="og:description" data-rh="true" content="Handpicked luxury short-stay apartments, homes and hotels across Nigeria. Browse verified listings and book instantly." />
  <meta property="og:url" data-rh="true" content="https://aparte.ng/" />
  <meta property="og:image" data-rh="true" content="https://aparte.ng/og-default.png" />
  <meta property="og:locale" data-rh="true" content="en_NG" />

  <!-- Twitter / X -->
  <meta name="twitter:card" data-rh="true" content="summary_large_image" />
  <meta name="twitter:title" data-rh="true" content="Aparte — Luxury Short-Stay Apartments & Homes in Nigeria" />
  <meta name="twitter:description" data-rh="true" content="Handpicked luxury short-stay apartments, homes and hotels across Nigeria. Browse verified listings and book instantly." />
  <meta name="twitter:image" data-rh="true" content="https://aparte.ng/og-default.png" />

  <!-- Registered-entity structured data, served in RAW HTML.

       The <Seo> component injects the same Organization node client-side, but
       that only reaches crawlers that execute JS (Googlebot). AI answer engines
       and social unfurlers (GPTBot, ClaudeBot, PerplexityBot, Bingbot, Slack,
       WhatsApp) largely fetch static HTML, so the legal entity has to be here
       to be citable. Same @id as src/lib/seo/schema.ts::organizationSchema(),
       so consumers merge the two nodes instead of seeing a duplicate entity.
       Keep the two in sync. -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "@id": "https://aparte.ng/#organization",
      "name": "Aparte Luxurious Homes",
      "legalName": "Aparte Digital Limited",
      "alternateName": ["Aparte", "Aparte Digital Limited"],
      "identifier": {
        "@type": "PropertyValue",
        "propertyID": "RC Number",
        "name": "Corporate Affairs Commission (Nigeria) registration number",
        "value": "9311297"
      },
      "url": "https://aparte.ng",
      "logo": "https://cdn.builder.io/api/v1/image/assets/TEMP/3b38bbc7c5ff8c386fd93465ae15df57abad2ed77415c2a134724b60741e6ac0?placeholderIfAbsent=true&apiKey=8e9d8cabec6941f3ad44d75c45253ccb",
      "email": "support@aparte.ng",
      "description": "Aparte connects discerning travellers with handpicked luxury short-stay apartments, homes and hotels across Nigeria. Browse verified listings, see real-time availability and book your next stay instantly.",
      "address": { "@type": "PostalAddress", "addressCountry": "NG" },
      "areaServed": { "@type": "Country", "name": "Nigeria" }
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,400&display=swap" rel="stylesheet">
  <script src="https://sdk.monnify.com/plugin/monnify.js"></script>
  <script src="https://js.paystack.co/v1/inline.js"></script>
  <!-- <script src="https://checkout.flutterwave.com/v3.js"></script> -->
</head>

<body>
  <div id="root"></div>
  <!-- Text fallback for crawlers and readers that don't execute JS. The React
       footer carries the same line once the app hydrates. -->
  <noscript>
    <h1>Aparte — Luxury Short-Stay Apartments &amp; Homes in Nigeria</h1>
    <p>
      Aparte connects travellers with handpicked, verified luxury short-stay apartments,
      homes and hotels across Nigeria. Aparte and Aparte Luxurious Homes are trading names
      of <strong>Aparte Digital Limited</strong>, a company registered in Nigeria with the
      Corporate Affairs Commission under <strong>RC 9311297</strong>.
      Contact: <a href="mailto:support@aparte.ng">support@aparte.ng</a>.
    </p>
  </noscript>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-element-bundle.min.js"></script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
